<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mata Mosquito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
    
    <div class="container">
        <div class="row">
            <div class="col">
                <div class="d-flex justify-content-center">
                <img src="./src/assets/img/game.png" alt="">
                </div>
            </div>
        </div>

            <div class="row">
            <div class="col">
                <div class="d-flex justify-content-center">

                    <div class="mb-2">                    
                    <select class="form-control" id="nivel">
                        <option value="">-- Selecione o nível --</option>
                        <option value="normal">Normal</option>
                        <option value="dificil">Dificil</option>
                        <option value="detetizador">Detetizador</option>
                    </select>
                   </div>
                
                </div>
                    </div>
                    </div>


         <div class="row">
            <div class="col">
                <div class="d-flex justify-content-center">
                <button type="button" class="btn btn-danger btn-lg" id="iniciar">Iniciar Jogo</button>
                </div>
            </div>
        </div>

    </div>

<script>
    const iniciar = document.querySelector('#iniciar')
    

    iniciar.addEventListener('click', iniciarJogo)
    

    function iniciarJogo(){

        let nivel = document.querySelector('#nivel').value

        if(nivel === ''){
            alert('Selecione um nível')
            return false
        }

        window.location.href = 'game.html?' + nivel
        
        }
</script>
</body>
</html>
